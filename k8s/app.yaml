apiVersion: v1
kind: Namespace
metadata:
  name: shipmenttracker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipmenttracker
  namespace: shipmenttracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shipmenttracker
  template:
    metadata:
      labels:
        app: shipmenttracker
    spec:
      containers:
        - name: shipmenttracker
          image: shipmenttracker:dev
          imagePullPolicy: IfNotPresent # image is loaded into kind, not pulled
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres:5432/shipments
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef: { name: postgres, key: POSTGRES_USER }
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD }
            # Random values made by `make deploy` (never stored in this repo).
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: shipmenttracker-auth, key: JWT_SECRET }
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: shipmenttracker-auth, key: ADMIN_TOKEN }
            - name: TOKEN_TTL_MINUTES
              value: "60"
            # Webhooks only go to public https URLs. Never set this to "true"
            # outside local development: it lets webhooks reach internal services.
            - name: WEBHOOK_ALLOW_PRIVATE
              value: "false"
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: shipmenttracker
  namespace: shipmenttracker
spec:
  selector:
    app: shipmenttracker
  ports:
    - port: 8080
      targetPort: 8080
